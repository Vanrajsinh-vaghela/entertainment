name: Auto Update Entertainment Homepage

on:
  push:
    paths:
      - 'posts/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Parse Posts & Build posts.json
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          const postsDir = path.join(process.cwd(), "posts");
          if (!fs.existsSync(postsDir)) {
            console.log("No posts directory found.");
            process.exit(0);
          }

          const files = fs.readdirSync(postsDir).filter(f => f.endsWith(".html"));
          const posts = [];

          for (const file of files) {
            const filePath = path.join(postsDir, file);
            const content = fs.readFileSync(filePath, "utf8");
            const stat = fs.statSync(filePath);

            const titleMatch = content.match(/<title[^>]*>([^<]+)<\/title>/i);
            const descMatch = content.match(/<meta\s+name=["\x27]description["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/i) || content.match(/<meta\s+property=["\x27]og:description["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/i);
            const imgMatch = content.match(/<meta\s+property=["\x27]og:image["\x27]\s+content=["\x27]([^"\x27]+)["\x27]/i) || content.match(/<img[^>]+src=["\x27]([^"\x27]+)["\x27]/i);
            const platformMatch = content.match(/Platform:<\/span>\s*<strong[^>]*>([^<]+)<\/strong>/i) || content.match(/<span[^>]*class=["\x27][^"\x27]*uppercase[^"\x27]*["\x27][^>]*>([^<]+)<\/span>/i);
            const statusMatch = content.match(/Status:<\/span>\s*<strong[^>]*>([^<]+)<\/strong>/i);
            const genreMatch = content.match(/Genre:<\/span>\s*<strong[^>]*>([^<]+)<\/strong>/i);
            const dateMatch = content.match(/"datePublished":\s*"([^"]+)"/i);

            let publishTime = stat.mtimeMs;
            if (dateMatch && !isNaN(Date.parse(dateMatch[1]))) {
              publishTime = Date.parse(dateMatch[1]);
            }

            posts.push({
              title: titleMatch ? titleMatch[1].trim() : file.replace(".html", ""),
              summary: descMatch ? descMatch[1].trim() : "",
              image: imgMatch ? imgMatch[1].trim() : "/images/default-banner.webp",
              link: "/posts/" + file,
              platform: platformMatch ? platformMatch[1].trim() : "THEATRES",
              genre: genreMatch ? genreMatch[1].trim() : "Entertainment",
              status: statusMatch ? statusMatch[1].trim() : "Streaming Now",
              timestamp: publishTime
            });
          }

          // Sort newest first
          posts.sort((a, b) => b.timestamp - a.timestamp);

          fs.writeFileSync(path.join(process.cwd(), "posts.json"), JSON.stringify(posts, null, 2), "utf8");
          console.log("posts.json generated successfully with " + posts.length + " posts.");
          '

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add posts.json
          git diff --staged --quiet || (git commit -m "⚡ Auto-update posts.json from /posts/" && git push)
