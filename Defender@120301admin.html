<!-- Extra Image 1 (Improved UI) -->
<div style="background: #1e1e24; border: 1px solid #333; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
   <label style="color: #ffcc00; font-weight: 800;">📸 Extra Image 1</label>
   <div style="display: flex; gap: 10px; align-items: center; margin-top: 5px;">
      <input type="file" id="extra-img-file-1" accept="image/*" onchange="handleExtraImage(event, 1)" style="padding: 8px; font-size: 14px;">
      <span style="font-size: 13px; color: #aaa;">Max 5MB, JPG/PNG</span>
   </div>
   <label style="margin-top: 8px; font-size: 12px;">Position Kahan Dikhana Hai?</label>
   <select id="extra-img-pos-1" style="margin-top: 5px; width: 100%;">
      <option value="">-- Do Not Show --</option>
      <option value="top">Top (Sabse Upar)</option>
      <option value="upper-middle">Upper Middle</option>
      <option value="middle">Exact Middle</option>
      <option value="lower-middle">Lower Middle</option>
      <option value="before-last" selected>Before Last Section</option>
      <option value="bottom">Very Bottom</option>
   </select>
</div>
