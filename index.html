  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #070809;
      --surface: #0d1013;
      --card-bg: #11151a;
      --card-border: #252b33;
      --accent: #e50914;
      --accent-hover: #ff2633;
      --text-main: #f7f7f8;
      --text-muted: #a7adb7;
      --text-dim: #9aa1aebf;
      --header-bg: #0a0a0a;
      --font-heading: 'Playfair Display', Georgia, serif;
      --font-body: 'Inter', sans-serif;
    }

    /* Auto Light Mode */
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #ffffff;
        --surface: #f5f6f8;
        --card-bg: #ffffff;
        --card-border: #e5e7eb;
        --accent: #2a5ca8;
        --accent-hover: #1e4a8c;
        --text-main: #1a1a1a;
        --text-muted: #4b5563;
        --text-dim: #6b7280;
        --header-bg: #ffffff;
      }
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }
    html { scroll-behavior: smooth; background: var(--bg); }
    body { background: var(--bg); color: var(--text-main); font-size: 16px; line-height: 1.6; min-height: 100vh; }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1200px; margin: 0 auto; padding: 0 16px; }

    /* Header */
    header { background: var(--header-bg); border-bottom: 1px solid var(--card-border); position: sticky; top: 0; z-index: 1000; }
    .top-bar { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; justify-items: center; padding: 12px 16px; max-width: 1200px; margin: 0 auto; }
    .brand-logo { font-family: var(--font-heading); font-size: 36px; font-weight: 900; letter-spacing: 1px; color: var(--accent); grid-column: 2; text-transform: uppercase; }
    .menu-btn { grid-column: 1; justify-self: start; background: none; border: none; color: var(--text-main); font-size: 24px; cursor: pointer; }
    .main-nav { display: flex; align-items: center; justify-content: center; gap: 14px; overflow-x: auto; padding: 10px 16px; border-bottom: 1px solid var(--card-border); max-width: 1200px; margin: 0 auto; scrollbar-width: none; }
    .main-nav::-webkit-scrollbar { display: none; }
    .nav-link { padding: 8px 16px; border: 1px solid transparent; border-radius: 999px; font-size: 15px; font-weight: 700; color: var(--text-muted); white-space: nowrap; cursor: pointer; transition: 0.2s; }
    .nav-link.active, .nav-link:hover { color: #fff; background: var(--accent); border-color: var(--accent); }

    /* Slow Ticker */
    .ticker-bar { background: var(--accent); color: #fff; padding: 8px 0; margin-bottom: 20px; overflow: hidden; white-space: nowrap; position: relative; }
    .ticker-label { display: inline-block; background: rgba(0,0,0,0.2); padding: 2px 8px; margin-right: 10px; font-size: 12px; border-radius: 4px; position: absolute; left: 0; z-index: 10; top: 0; bottom: 0; display: flex; align-items: center; }
    .ticker-content { display: inline-block; padding-left: 100%; animation: ticker 60s linear infinite; }
    @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }

    /* Hero Slider */
    .hero-slider-wrap { position: relative; margin-bottom: 20px; border-radius: 10px; overflow: hidden; }
    .hero-slide { display: none; position: relative; }
    .hero-media-wrap { width: 100%; aspect-ratio: 16/9; background: #000; }
    .hero-media-wrap img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .hero-content { position: absolute; bottom: 0; left: 0; right: 0; background: linear-gradient(to top, rgba(0,0,0,0.9), transparent); padding: 30px 20px 20px; z-index: 2; transition: opacity 0.3s; }
    
    /* Fix: Hide content when video plays */
    .hero-content.hidden { display: none !important; }

    .hero-meta-row { color: var(--accent); font-weight: 800; text-transform: uppercase; font-size: 12px; margin-bottom: 5px; }
    .hero-title { font-family: var(--font-heading); font-size: 32px; font-weight: 800; color: #fff; margin-bottom: 10px; line-height: 1.2; }
    .hero-actions { display: flex; gap: 10px; }
    .hero-btn { background: var(--accent); color: #fff; padding: 10px 20px; border-radius: 5px; font-weight: 800; border: none; cursor: pointer; }
    .hero-btn-trailer { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.5); }

    /* Section Title */
    .section-title { margin: 32px 0 14px; font-family: var(--font-heading); font-size: 24px; font-weight: 800; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
    .section-title::after { content: ""; width: 4px; height: 20px; background: var(--accent); order: -1; }

    /* Most Popular Layout */
    .most-popular-layout { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; margin-bottom: 32px; }
    
    /* Sidebar for Popular Right Column */
    .featured-sidebar { display: flex; flex-direction: column; gap: 20px; }

    /* Popular List with small thumbnails */
    .popular-list { display: flex; flex-direction: column; gap: 12px; }
    .popular-item { display: flex; gap: 12px; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--card-border); }
    .popular-rank { font-family: var(--font-heading); font-size: 28px; font-weight: 900; color: var(--text-dim); line-height: 1; }
    .popular-thumb { width: 60px; height: 60px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .popular-info { flex: 1; min-width: 0; }
    .popular-cat { font-size: 11px; color: var(--accent); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; display: block; margin-bottom: 4px; }
    .popular-title { font-family: var(--font-heading); font-size: 16px; font-weight: 800; color: var(--text-main); line-height: 1.3; }

    /* 6 Slide Popular Featured Slider */
    .popular-featured { position: relative; overflow: hidden; border-radius: 10px; border: 1px solid var(--card-border); }
    .pf-slide { display: none; }
    .pf-slide img { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
    .pf-content { padding: 12px; background: var(--card-bg); }
    .pf-content span { color: var(--accent); font-weight: 800; text-transform: uppercase; font-size: 11px; }
    .pf-content h3 { font-family: var(--font-heading); color: var(--text-main); font-size: 18px; margin-top: 5px; line-height: 1.3; }

    /* Explore By Category */
    .cat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .cat-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 15px; text-align: center; cursor: pointer; transition: 0.2s; }
    .cat-card:hover { border-color: var(--accent); background: var(--surface); }

    /* Latest News List */
    .card-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .news-card { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 8px; padding: 10px; display: flex; gap: 12px; align-items: center; transition: 0.2s; }
    .news-card:hover { border-color: var(--accent); }
    .news-thumb { width: 120px; height: 80px; object-fit: cover; border-radius: 6px; flex-shrink: 0; }
    .news-meta { font-size: 11px; color: var(--accent); font-weight: 700; text-transform: uppercase; margin-bottom: 4px; letter-spacing: 1px; }
    .news-title { font-family: var(--font-heading); font-size: 16px; font-weight: 800; color: var(--text-main); line-height: 1.3; }

    /* Footer */
    footer { text-align: center; margin-top: 40px; padding: 20px 16px; border-top: 1px solid var(--card-border); font-size: 14px; color: var(--text-muted); }
    .footer-links { display: flex; justify-content: center; flex-wrap: wrap; gap: 15px; margin-bottom: 10px; }
    .footer-links a { color: var(--text-muted); text-decoration: none; transition: 0.2s; }
    .footer-links a:hover { color: var(--accent); }

    /* Pagination */
    .pagination-container { display: flex; justify-content: center; gap: 8px; margin-top: 30px; }
    .page-btn { background: var(--card-bg); border: 1px solid var(--card-border); color: var(--text-main); padding: 8px 14px; border-radius: 6px; cursor: pointer; font-size: 14px; font-weight: 700; }
    .page-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .page-btn:disabled { opacity: 0.4; cursor: not-allowed; }

    /* Mobile Optimization */
    @media (max-width: 768px) {
        .brand-logo { font-size: 24px; }
        .hero-title { font-size: 22px; }
        .hero-actions { flex-wrap: wrap; gap: 8px; }
        .hero-btn { padding: 8px 12px; font-size: 14px; }
        .most-popular-layout { grid-template-columns: 1fr; gap: 20px; }
        .card-grid { grid-template-columns: 1fr; }
        .news-thumb { width: 100px; height: 70px; }
        .popular-thumb { width: 50px; height: 50px; }
        .cat-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
</head>
<body>

    <div class="top-bar">
      <button class="menu-btn">☰</button>

      <div></div>

  <div class="container">
    <div class="ticker-bar">
      <div class="ticker-label">BREAKING:</div>
      <div class="ticker-content" id="ticker-viewport">Loading latest updates...</div>
    </div>

    <div id="hero-slider-wrap" class="hero-slider-wrap"></div>

    <!-- FIXED: Most Popular Section is ALWAYS VISIBLE (No display:none) to prevent scroll jump -->
    <div class="most-popular-layout">
      <div id="popular-list-container" class="popular-list"></div>
      
      <div class="featured-sidebar">

        <div class="section-title" style="margin-top: 10px;">Explore By Category</div>

    <div class="section-title" id="posts-list-heading">Latest News & Updates</div>

  <footer>

  <script>
    let rawPosts = [];
    let currentCategory = 'All';
    const POSTS_PER_PAGE = 6;
    let currentPage = 1;

    let heroTimer = null;
    let heroCurrentIndex = 0;
    let heroTotalSlides = 0;
    let isHeroPaused = false;

    let pfTimer = null;
    let pfIndex = 0;
    let pfTotal = 0;

    function safeText(value, fallback = '') { return value === null || value === undefined ? fallback : String(value); }
    function safeUrl(value, fallback = '#') { const raw = safeText(value, '').trim(); if (!raw) return fallback; try { const u = new URL(raw, window.location.href); if (u.protocol === 'http:' || u.protocol === 'https:') return u.href; } catch (_) {} return fallback; }

    function formatDate(dateStr) {
      if (!dateStr) return "September 7 2026 , 24:00";
      const date = new Date(dateStr);
      if (isNaN(date.getTime())) return dateStr;
      const month = date.toLocaleString('en-US', { month: 'long' });
      const day = date.getDate();
      const year = date.getFullYear();
      const hours = String(date.getHours()).padStart(2, '0');
      const minutes = String(date.getMinutes()).padStart(2, '0');
      return `${month} ${day} ${year} , ${hours}:${minutes}`;
    }

    function normalizePosts(data) {
      if (!Array.isArray(data)) return [];
      return data.filter(p => p && typeof p === 'object').map(p => ({
        ...p, title: safeText(p.title, 'Untitled'), slug: safeText(p.slug, ''), url: safeText(p.url, ''),
        image: safeText(p.image, ''), summary: safeText(p.summary, ''), category: safeText(p.category, 'News'),
        platform: safeText(p.platform, 'General'), badge: safeText(p.badge, 'Trending'), date: safeText(p.date, '2026'),
        trailer: safeText(p.trailer, ''), author: 'Filmy Khabr', formattedDate: formatDate(safeText(p.date, ''))
      }));
    }

    function getYoutubeEmbedUrl(url) {
      if (!url) return null; let videoId = '';
      if (url.includes('youtu.be/')) videoId = url.split('youtu.be/')[1].split(/[?#]/)[0];
      else if (url.includes('watch?v=')) videoId = url.split('watch?v=')[1].split('&')[0];
      else if (url.includes('/embed/')) videoId = url.split('/embed/')[1].split(/[?#]/)[0];
      else if (url.length === 11 && !url.includes('/')) videoId = url;
      return videoId ? `https://www.youtube-nocookie.com/embed/${videoId}?autoplay=1&rel=0` : null;
    }

    // FIX: Trailer play hone par text hide karna
    function playHeroInline(slideIndex, title, videoUrl) {
      const embedUrl = getYoutubeEmbedUrl(videoUrl);
      if (!embedUrl) { const query = encodeURIComponent(title + " official trailer"); window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank'); return; }
      const mediaWrap = document.getElementById(`hero-media-${slideIndex}`);
      if (mediaWrap) {
        isHeroPaused = true;
        if (heroTimer) clearInterval(heroTimer);
        
        // Hide the text container
        const contentBox = document.getElementById(`hero-content-${slideIndex}`);
        if(contentBox) contentBox.style.display = 'none';

        mediaWrap.innerHTML = `<iframe src="${embedUrl}" style="width:100%;height:100%;border:0;" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe>`;
      }
    }

    function setupBreakingTicker(posts) {
      const viewport = document.getElementById('ticker-viewport');
      let tickerItems = [];
      if (posts && posts.length > 0) posts.slice(0, 10).forEach(p => tickerItems.push(p.title));
      if (tickerItems.length === 0) tickerItems = ['Top OTT & Web Series Weekly Updates', 'Bollywood & South Cinema Box Office Updates'];
      viewport.textContent = tickerItems.join("   •   ") + "   •   ";
    }

    function setupHeroSlider(posts) {
      const heroWrap = document.getElementById('hero-slider-wrap');
      const heroPosts = posts.slice(0, 10);
      heroTotalSlides = heroPosts.length; heroCurrentIndex = 0;
      if (!heroTotalSlides) { heroWrap.innerHTML = ''; return; }

      heroWrap.innerHTML = heroPosts.map((post, idx) => `
        <div class="hero-slide" id="hero-slide-${idx}" style="${idx === 0 ? 'display:block;' : 'display:none;'}">
          <div class="hero-media-wrap" id="hero-media-${idx}">
            <img src="${post.image || 'images/default.jpg'}" alt="${post.title}" loading="lazy">
          </div>
          <div class="hero-content" id="hero-content-${idx}">
            <div class="hero-meta-row">${post.platform || post.category}</div>
            <h2 class="hero-title">${post.title}</h2>
            <div class="hero-actions">
              <a href="${post.url || `posts/${post.slug}.html`}" class="hero-btn">Read Article</a>
              <button class="hero-btn hero-btn-trailer" onclick="playHeroInline(${idx}, '${post.title.replace(/'/g, "\\'")}', '${post.trailer || 'https://www.youtube.com'}')">▶ Play Trailer</button>
            </div>
          </div>
        </div>
      `).join('');

      if (heroTotalSlides > 1) {
        if (heroTimer) clearInterval(heroTimer);
        heroTimer = setInterval(() => {
          if (isHeroPaused) return;
          const current = document.getElementById(`hero-slide-${heroCurrentIndex}`);
          if (current) current.style.display = 'none';
          heroCurrentIndex = (heroCurrentIndex + 1) % heroTotalSlides;
          const next = document.getElementById(`hero-slide-${heroCurrentIndex}`);
          if (next) {
            next.style.display = 'block';
            // Ensure text shows up again on new slide
            const nextContent = document.getElementById(`hero-content-${heroCurrentIndex}`);
            if(nextContent) nextContent.style.display = 'block';
          }
        }, 4500);
      }
    }

    // FIX: Popular Now with small thumbnails & 6 Slider
    function renderMostPopular(posts) {
      const popularContainer = document.getElementById('popular-list-container');
      const featuredContainer = document.getElementById('popular-featured-container');
      if (!posts.length) return;

      // Attractive list with 60x60 thumbnails
      const listPosts = posts.slice(0, 5);
      popularContainer.innerHTML = listPosts.map((p, idx) => `
        <div class="popular-item">
          <div class="popular-rank">${idx + 1}</div>
          <img class="popular-thumb" src="${p.image || 'images/default.jpg'}" alt="${p.title}">
          <div class="popular-info">
            <span class="popular-cat">${p.category}</span>
            <a href="${p.url || `posts/${p.slug}.html`}" class="popular-title">${p.title}</a>
          </div>
        </div>
      `).join('');

      const featuredPosts = posts.slice(0, 6);
      pfTotal = featuredPosts.length;
      pfIndex = pfTotal - 1; // Start from last (Reverse)

      featuredContainer.innerHTML = featuredPosts.map((p, idx) => `
        <div class="pf-slide" id="pf-slide-${idx}" style="${idx === pfTotal - 1 ? 'display:block;' : 'display:none;'}">
          <img src="${p.image || 'images/default.jpg'}" alt="${p.title}" loading="lazy">
          <div class="pf-content">
            <span>${p.category}</span>
            <h3>${p.title}</h3>
          </div>
        </div>
      `).join('');

      // Reverse Rotation (6, 5, 4, 3, 2, 1)
      if (pfTotal > 1) {
        if (pfTimer) clearInterval(pfTimer);
        pfTimer = setInterval(() => {
          const current = document.getElementById(`pf-slide-${pfIndex}`);
          if (current) current.style.display = 'none';
          pfIndex = (pfIndex - 1 + pfTotal) % pfTotal;
          const next = document.getElementById(`pf-slide-${pfIndex}`);
          if (next) next.style.display = 'block';
        }, 6000);
      }
    }

    function renderPaginatedNewsList(posts) {
      const container = document.getElementById('posts-list-container');
      const paginationEl = document.getElementById('pagination-box');
      if (!posts.length) { container.innerHTML = `<div style="grid-column:1/-1; text-align:center; color:var(--text-muted); padding:20px;">Is category mein abhi koi post nahi mili.</div>`; paginationEl.innerHTML = ''; return; }

      const totalPages = Math.ceil(posts.length / POSTS_PER_PAGE);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;
      const startIndex = (currentPage - 1) * POSTS_PER_PAGE;
      const endIndex = startIndex + POSTS_PER_PAGE;
      const currentPosts = posts.slice(startIndex, endIndex);

      container.innerHTML = currentPosts.map(post => `
        <a href="${post.url || `posts/${post.slug}.html`}" class="news-card">
          <img class="news-thumb" src="${post.image || 'images/default.jpg'}" alt="${post.title}" loading="lazy">
          <div style="flex:1; min-width:0;">
            <div class="news-meta">${post.category}</div>
            <div class="news-title">${post.title}</div>
          </div>
        </a>
      `).join('');

      renderBoxPagination(totalPages);
    }

    function renderBoxPagination(totalPages) {
      const paginationEl = document.getElementById('pagination-box');
      if (totalPages <= 1) { paginationEl.innerHTML = ''; return; }
      let paginationHTML = '';
      if (currentPage > 1) paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage - 1})">« Prev</button>`;
      else paginationHTML += `<button class="page-btn" disabled>« Prev</button>`;
      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          if (i === currentPage) paginationHTML += `<button class="page-btn active">${i}</button>`;
          else paginationHTML += `<button class="page-btn" onclick="changePage(${i})">${i}</button>`;
        } else if (i === currentPage - 3 || i === currentPage + 3) paginationHTML += `<span style="color: var(--text-muted); padding: 0 4px;">...</span>`;
      }
      if (currentPage < totalPages) paginationHTML += `<button class="page-btn" onclick="changePage(${currentPage + 1})">Next »</button>`;
      else paginationHTML += `<button class="page-btn" disabled>Next »</button>`;
      paginationEl.innerHTML = paginationHTML;
    }

    function changePage(page) {
      currentPage = page;
      if (currentCategory === 'All') renderPaginatedNewsList(rawPosts);
      else {
        let filtered = rawPosts.filter(p => {
          const c = (p.category || '').toLowerCase(); const target = currentCategory.toLowerCase();
          return c.includes(target) || target.includes(c);
        });
        renderPaginatedNewsList(filtered);
      }
      window.scrollTo({ top: 400, behavior: 'smooth' });
    }

    // FIX: Removed display:none logic to prevent layout shift/scroll jump
    function filterCategory(catName, updateUrl = true) {
      currentCategory = catName;
      currentPage = 1;

      document.querySelectorAll('.nav-link').forEach(el => {
        if (el.textContent.trim().toLowerCase() === catName.toLowerCase() || (catName === 'All' && el.textContent.trim() === 'Home')) {
          el.classList.add('active');
        } else { el.classList.remove('active'); }
      });

      const filterBanner = document.getElementById('posts-list-heading');
      if (catName === 'All') {
        filterBanner.textContent = "Latest News & Updates";
      } else {
        filterBanner.textContent = `All ${catName} Articles`;
      }

      if (updateUrl) {
        const newUrl = catName === 'All' ? window.location.pathname : `?cat=${encodeURIComponent(catName)}`;
        window.history.pushState({}, '', newUrl);
      }

      if (catName === 'All') { renderAll(); }
      else {
        let filtered = [];
        if (catName === 'Trending') filtered = rawPosts.filter(p => (p.badge || '').toLowerCase() === 'trending');
        else filtered = rawPosts.filter(p => { const c = (p.category || '').toLowerCase(); const target = catName.toLowerCase(); return c.includes(target) || target.includes(c); });
        renderPaginatedNewsList(filtered);
      }
      // Scroll completely removed so user stays at the same position!
    }

    function renderAll() {
      if (!rawPosts || rawPosts.length === 0) return;
      isHeroPaused = false;
      setupHeroSlider(rawPosts);
      renderMostPopular(rawPosts);
      renderPaginatedNewsList(rawPosts);
    }

    async function loadSiteData() {
      try {
        const res = await fetch(`data/posts.json?_t=${Date.now()}`);
        if (!res.ok) throw new Error('data/posts.json not found');
        rawPosts = await res.json();
        setupBreakingTicker(rawPosts);
        const params = new URLSearchParams(window.location.search);
        const urlCat = params.get('cat');
        if (urlCat) filterCategory(urlCat, false);
        else renderAll();
      } catch (err) {
        console.warn('Could not load posts:', err);
        setupBreakingTicker([]);
        document.getElementById('posts-list-container').innerHTML = `<div style="text-align:center; padding:40px;">Koi post publish nahi hui hai.</div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', loadSiteData);
  </script>
</body>
</html>
