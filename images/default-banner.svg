<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b"/>
      <stop offset="50%" stop-color="#141417"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>

    <!-- Brand Accent Gradient -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e50914"/>
      <stop offset="100%" stop-color="#ff3b30"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#e50914" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#glow)"/>

  <!-- Border Frame -->
  <rect x="20" y="20" width="1160" height="635" rx="24" fill="none" stroke="#27272a" stroke-width="2"/>

  <!-- Film Clapperboard Icon -->
  <g transform="translate(540, 200)">
    <rect x="0" y="0" width="120" height="90" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="3"/>
    <polygon points="48,30 48,60 78,45" fill="#e50914"/>
    <circle cx="60" cy="45" r="40" fill="none" stroke="#e50914" stroke-width="2" stroke-dasharray="4 4"/>
  </g>

  <!-- Brand Typography -->
  <!-- Main Title -->
  <text x="600" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="38" letter-spacing="1">
    <tspan fill="#e50914">GUJARAT</tspan>
    <tspan fill="#ffffff"> FAST ALERT</tspan>
  </text>

  <!-- Subtitle Badge -->
  <rect x="490" y="390" width="220" height="32" rx="8" fill="#e50914" fill-opacity="0.15" stroke="#e50914" stroke-width="1"/>
  <text x="600" y="411" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="14" fill="#fbbf24" letter-spacing="4">
    ENTERTAINMENT
  </text>

  <!-- Footer Tagline -->
  <text x="600" y="465" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="16" fill="#71717a" letter-spacing="1">
    Latest Hindi Movies • OTT Releases • Web Series
  </text>
</svg>
